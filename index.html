<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan Primak | Personal Homepage</title>
    <link rel="icon" type="image/jpeg" href="images/favico.jpg">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #222222;
            background-color: #f4f6f9;
            margin: 0;
            padding: 2rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            color: #1a365d;
            border-bottom: 3px solid #3182ce;
            padding-bottom: 0.5rem;
        }

        h2 {
            font-family: Georgia, 'Times New Roman', serif;
        }
        p {
            font-size: 1.1rem;
        }

        main img {
            display: block;
            max-width: 100%;
            width: 500px;
            height: auto;
            border-radius: 6px;
            margin: 1rem 0;
        }

        .course-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.25rem;
            background-color: #1a365d;
            /* White gives the text in the button the best contrast in the blue button. */
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .course-link:hover, 
        .course-link:focus {
            background-color: #2b6cb0;
            outline: 2px solid #2b6cb0;
        }

        footer {
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid #cbd5e0;
            font-size: 0.9rem;
            color: #4a5568;
        }

        footer a {
            color: #2b6cb0;
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>

    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>

    <header>
        <h1>Ethan Primak</h1>
    </header>

    <main>
        <h2>Personal Homepage</h2>
        <p>Welcome to my homepage. I am a student interested in all things technology. In my freetime I like to spend time with friends and do outdoor activities. I hope you enjoy my site!  </p>
        <a class="course-link" href="itis3135/">Visit my ITIS 3135 Site</a>

        <img src="images/beach.jpg" alt="Photo of a sunset I took while with my family.">
    </main>

    <footer>
        <p>2026 - Ethan Primak</p>
        <p><em>"Progress over perfection"</em></p>
    </footer>

    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
</body>
</html>
